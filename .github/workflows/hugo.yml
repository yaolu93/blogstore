name: Check and deploy Hugo site

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "README.md"
      - ".vscode/**"
      - "*_update_hugo_blog.sh"
      - "preview_hugo.sh"
      - "update.sh"
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# PR checks have separate queues; production deployments finish uninterrupted.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.128.0
      HUGO_ENVIRONMENT: production
    steps:
      - name: Install Hugo CLI
        run: |
          wget --timeout=30 --tries=3 -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build and check site
        id: build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_RESOURCEDIR: ${{ runner.temp }}/hugo_resources
          # PR builds exercise subdirectory URLs without accessing Pages settings.
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || 'https://example.invalid/blogstore/' }}
        run: |
          publish_dir="$(mktemp -d "${RUNNER_TEMP}/blogstore-public.XXXXXX")"
          hugo \
            --minify \
            --destination "$publish_dir"
          hugo list all > "${RUNNER_TEMP}/content-inventory.csv"
          python3 .github/scripts/check_site.py \
            "$publish_dir" \
            "$HUGO_BASEURL" \
            "${RUNNER_TEMP}/content-inventory.csv"
          echo "path=$publish_dir" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
